name: Test

# Every push to main is tested, and so is every pull request into it, so that a
# change is known to pass before it lands rather than only after.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# a test of the document viewer that finds its libraries missing fails here
# rather than skipping, as it does in a checkout that never fetched them
env:
  GOFS_REQUIRE_VIEWER: "1"

# a newer push to the same branch or pull request makes the older run moot
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # the libraries of the document viewer, fetched from npm at the versions
      # internal/httpd/viewer/libraries.lock pins and checked against the
      # sha512 it pins; the cache asks npm again only when the lock changes
      - uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/go-fs-npm
          key: viewer-${{ hashFiles('internal/httpd/viewer/libraries.lock') }}
      - name: fetch the viewer libraries
        env:
          GOFS_NPM_CACHE: ${{ runner.temp }}/go-fs-npm
        run: go run ./tools/viewer

      - name: vet and gofmt
        run: make lint

      # vet on Linux never compiles the *_windows.go and *_darwin.go files, so
      # a build break in one of them would otherwise first show in a release
      - name: vet for windows and darwin
        run: |
          GOOS=windows go vet ./...
          GOOS=darwin go vet ./...

      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  test:
    # the binaries ship for all three, and the filesystems differ where it
    # matters here: case folding, separators, permissions and symlinks
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # the libraries of the document viewer, fetched from npm at the versions
      # internal/httpd/viewer/libraries.lock pins and checked against the
      # sha512 it pins; the cache asks npm again only when the lock changes
      - uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/go-fs-npm
          key: viewer-${{ hashFiles('internal/httpd/viewer/libraries.lock') }}
      - name: fetch the viewer libraries
        env:
          GOFS_NPM_CACHE: ${{ runner.temp }}/go-fs-npm
        run: go run ./tools/viewer

      # the race detector runs where it is cheapest; every server here is
      # concurrent, so it runs on every change all the same
      - name: test with race detector and coverage
        if: runner.os == 'Linux'
        run: |
          go test ./... -race -count=1 -timeout 15m -coverprofile=coverage.out
          {
            echo '### Coverage'
            echo '```'
            go tool cover -func=coverage.out | tail -1
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: test
        if: runner.os != 'Linux'
        run: go test ./... -count=1 -timeout 15m

      - name: upload coverage
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.out

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # the libraries of the document viewer, fetched from npm at the versions
      # internal/httpd/viewer/libraries.lock pins and checked against the
      # sha512 it pins; the cache asks npm again only when the lock changes
      - uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/go-fs-npm
          key: viewer-${{ hashFiles('internal/httpd/viewer/libraries.lock') }}
      - name: fetch the viewer libraries
        env:
          GOFS_NPM_CACHE: ${{ runner.temp }}/go-fs-npm
        run: go run ./tools/viewer

      # every release target still cross compiles
      - name: make build
        run: make build

  fuzz:
    # the seed corpora run in every test job above; the longer run is for main,
    # where it has time to find what the seeds do not
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: fuzz
        run: make fuzz FUZZTIME=20s

      # a failing input is written under testdata/fuzz; committing it makes it
      # part of the seed corpus from then on
      - name: upload failing inputs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-failures
          path: '**/testdata/fuzz/**'

  packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # the libraries of the document viewer, fetched from npm at the versions
      # internal/httpd/viewer/libraries.lock pins and checked against the
      # sha512 it pins; the cache asks npm again only when the lock changes
      - uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/go-fs-npm
          key: viewer-${{ hashFiles('internal/httpd/viewer/libraries.lock') }}
      - name: fetch the viewer libraries
        env:
          GOFS_NPM_CACHE: ${{ runner.temp }}/go-fs-npm
        run: go run ./tools/viewer

      # a second, higher version as well, for the upgrade below
      - name: make packages
        run: |
          make packages
          make rpm VERSION="$(cat VERSION).1"

      # the rpms to upgrade from below: that of the latest release, and that of
      # 0.19.1, the last release that shipped the configuration as a config
      # file rather than leaving it to go-fs to write
      - name: download the released rpms
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo "$GITHUB_REPOSITORY" --dir released/latest \
            --pattern 'go-fs-[0-9]*.x86_64.rpm'
          gh release download v0.19.1 --repo "$GITHUB_REPOSITORY" --dir released/config-file \
            --pattern 'go-fs-[0-9]*.x86_64.rpm'
          ls -R released

      # install, start, upgrade and remove the rpm the way dnf does on a
      # server; the container has no systemd, so go-fs is started by hand as
      # the account the unit runs it as. The rpm ships no configuration: go-fs
      # writes the starter at its first start. The upgrade keeps the
      # configuration go-fs wrote its secrets into, and the removal keeps it as
      # go-fs.toml.rpmsave. Then the upgrades from the released rpms: each has
      # to keep the configuration go-fs ran with, and the one from 0.19.1, which
      # owned the file as a config file, must leave it where it is rather than
      # move it aside as go-fs.toml.rpmsave on the way to owning it as a ghost.
      - name: install the rpm
        run: |
          docker run --rm -v "$PWD/dist:/dist:ro" -v "$PWD/released:/released:ro" rockylinux:9 sh -euxc '
            version=$(ls /dist/go-fs-[0-9]*.x86_64.rpm | sort -V | head -1)
            update=$(ls /dist/go-fs-[0-9]*.x86_64.rpm | sort -V | tail -1)
            latest=$(ls /released/latest/go-fs-[0-9]*.x86_64.rpm)
            configfile=$(ls /released/config-file/go-fs-[0-9]*.x86_64.rpm)
            # serve starts go-fs as the service would, waits for it to answer
            # and stops it again, leaving its log in /tmp/go-fs.log
            serve() {
              setpriv --reuid go-fs --regid go-fs --init-groups \
                /usr/bin/go-fs -config /etc/go-fs/go-fs.toml > /tmp/go-fs.log 2>&1 &
              pid=$!
              for i in $(seq 1 20); do curl -sS -o /dev/null http://127.0.0.1:8080/ && break; sleep 0.5; done
              # every path needs an account by default, http.pathsWithoutAuth
              # being empty, so the root refuses a stranger and serves the
              # admin account the template starts with
              test "$(curl -sS -o /dev/null -w "%{http_code}" http://127.0.0.1:8080/)" = 401
              curl -fsS -o /dev/null -u admin:admin http://127.0.0.1:8080/
              kill $pid; wait $pid || true
              cat /tmp/go-fs.log
            }
            # upgrade installs a released rpm, runs it, upgrades to this
            # checkout and checks that the configuration came through; it
            # removes go-fs again afterwards
            upgrade() {
              dnf install -y "$1"
              serve
              secret=$(grep "^httpSessionTokenSecret = " /etc/go-fs/go-fs.toml)
              # a value of [http] of its own, which a release before its
              # tables keeps directly in [http]
              sed -i "s/^maxConnections = .*/maxConnections = 77/" /etc/go-fs/go-fs.toml
              # the released rpm may be newer than this checkout, so the
              # upgrade to it is forced the way rpm -U --oldpackage does one
              rpm -U --oldpackage "$update"
              test ! -e /etc/go-fs/go-fs.toml.rpmsave
              grep -qxF "$secret" /etc/go-fs/go-fs.toml
              serve
              grep -qxF "$secret" /etc/go-fs/go-fs.toml
              if grep -q "wrote the starter configuration" /tmp/go-fs.log; then
                echo "go-fs wrote a starter over the upgraded configuration"; exit 1
              fi
              # a new secret would end the share links and the logins of the
              # release upgraded from, though the old one is still in the file
              if grep -q "generated a secret" /tmp/go-fs.log; then
                echo "go-fs replaced a secret of the upgraded configuration"; exit 1
              fi
              # the keys of [http] are moved into its tables with their values,
              # and none is left where this version no longer reads it
              grep -qx "maxConnections = 77" /etc/go-fs/go-fs.toml
              grep -qx "\[http.connection\]" /etc/go-fs/go-fs.toml
              if grep -q "no longer reads" /tmp/go-fs.log; then
                echo "go-fs left a key of the upgraded configuration unread"; exit 1
              fi
              if awk "/^\[http\]/{f=1;next} /^\[/{f=0} f && /^[A-Za-z]/" /etc/go-fs/go-fs.toml | grep -q .; then
                echo "go-fs left keys directly in [http]"; exit 1
              fi
              dnf remove -y go-fs
              rm -f /etc/go-fs/go-fs.toml.rpmsave
            }
            dnf install -y "$version"
            id go-fs
            test ! -e /etc/go-fs/go-fs.toml
            test "$(stat -c %U /etc/go-fs)" = go-fs
            test "$(stat -c %U /var/lib/go-fs/files)" = go-fs
            test "$(stat -c %U /var/lib/go-fs/registry)" = go-fs
            test "$(stat -c %U:%a /var/lib/go-fs/trash)" = go-fs:700
            if runuser -u go-fs -- /usr/bin/go-fs -check -config /etc/go-fs/go-fs.toml; then
              echo "-check passed on a configuration that is not there"; exit 1
            fi
            test ! -e /etc/go-fs/go-fs.toml
            serve
            grep -q "wrote the starter configuration" /tmp/go-fs.log
            grep -q "installer=rpm" /tmp/go-fs.log
            grep -q "documentation prints" /tmp/go-fs.log
            test "$(stat -c %U:%a /etc/go-fs/go-fs.toml)" = go-fs:600
            grep -qxF "baseFolderRegistry = \"/var/lib/go-fs/registry\"" /etc/go-fs/go-fs.toml
            grep -q "^httpSessionTokenSecret = \"..*\"" /etc/go-fs/go-fs.toml
            runuser -u go-fs -- /usr/bin/go-fs -check -config /etc/go-fs/go-fs.toml
            rpm -qf /etc/go-fs/go-fs.toml
            dnf install -y "$update"
            rpm -q go-fs
            grep -q "^httpSessionTokenSecret = \"..*\"" /etc/go-fs/go-fs.toml
            dnf remove -y go-fs
            test ! -e /usr/bin/go-fs
            test ! -e /etc/go-fs/go-fs.toml
            grep -q "^httpSessionTokenSecret = \"..*\"" /etc/go-fs/go-fs.toml.rpmsave
            rm -f /etc/go-fs/go-fs.toml.rpmsave

            upgrade "$latest"
            # 0.19.1 wrote the configuration when it was installed
            rpm -qp --configfiles "$configfile" | grep -qxF /etc/go-fs/go-fs.toml
            upgrade "$configfile"
          '

      - uses: actions/upload-artifact@v7
        with:
          name: msi-inputs
          path: |
            build/pkg/go-fs_windows_*.exe
          if-no-files-found: error

  msi:
    needs: packages
    runs-on: windows-latest
    env:
      DOTNET_ROLL_FORWARD: Major
      WIX_VERSION: 5.0.2
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: msi-inputs
          path: build/pkg

      - name: install the WiX Toolset
        shell: pwsh
        run: |
          dotnet tool install --global wix --version $env:WIX_VERSION
          wix extension add --global WixToolset.Util.wixext/$env:WIX_VERSION
          wix extension add --global WixToolset.Firewall.wixext/$env:WIX_VERSION
          wix extension add --global WixToolset.UI.wixext/$env:WIX_VERSION

      - name: build the msi
        shell: pwsh
        run: |
          wix build packaging/windows/go-fs.wxs -arch x64 `
            -ext WixToolset.Util.wixext -ext WixToolset.Firewall.wixext -ext WixToolset.UI.wixext `
            -d Version=0.0.1 `
            -d Bin="$PWD\build\pkg\go-fs_windows_amd64.exe" `
            -o go-fs.msi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # install it as an admin would, quietly, and see the service come up and
      # serve, then go away again with the uninstall
      - name: install the msi
        shell: pwsh
        run: |
          $install = Start-Process msiexec -Wait -PassThru -ArgumentList "/i go-fs.msi /qn /l*v install.log"
          if ($install.ExitCode -ne 0) { Get-Content install.log -Tail 80; exit $install.ExitCode }
          $service = Get-Service go-fs
          $service | Format-List Name, Status, StartType
          if ($service.StartType -ne "Automatic") { throw "the service does not start with Windows" }
          $up = $false
          foreach ($i in 1..20) {
            try { $root = Invoke-WebRequest -UseBasicParsing -SkipHttpErrorCheck http://127.0.0.1:8080/; $up = $true; break }
            catch { Start-Sleep -Milliseconds 500 }
          }
          $log = "$env:ProgramData\go-fs\logs\go-fs.log"
          Get-Content $log
          if (-not $up) { throw "go-fs does not answer on 127.0.0.1:8080" }
          # the msi ships no configuration: the service wrote the starter
          if (-not (Test-Path "$env:ProgramData\go-fs\go-fs.toml")) { throw "go-fs wrote no configuration" }
          if (-not (Select-String -Quiet -Path $log -Pattern "wrote the starter configuration")) { throw "the log does not say go-fs wrote the starter" }
          if (-not (Select-String -Quiet -Path "$env:ProgramData\go-fs\go-fs.toml" -SimpleMatch -Pattern 'baseFolderFiles = "C:/ProgramData/go-fs/files"')) { throw "the starter does not serve C:/ProgramData/go-fs/files" }
          # every path needs an account by default, http.pathsWithoutAuth being
          # empty, so the root refuses a stranger and serves the admin account
          # the template starts with
          if ($root.StatusCode -ne 401) { throw "/ answers $($root.StatusCode) without an account, not 401" }
          $admin = @{ Authorization = "Basic " + [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes("admin:admin")) }
          Invoke-WebRequest -UseBasicParsing -Headers $admin http://127.0.0.1:8080/ | Out-Null
          if (-not (Test-Path "$env:ProgramData\go-fs\registry")) { throw "the install made no registry folder" }
          if (-not (Test-Path "$env:ProgramData\go-fs\trash")) { throw "the install made no trash folder" }
          try { Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8080/v2/ | Out-Null }
          catch { if ($_.Exception.Response.StatusCode.value__ -ne 401) { throw "the registry does not answer on /v2/: $_" } }
          if (-not (Select-String -Quiet -Path $log -Pattern "installer=msi")) { throw "the log does not say msi" }
          Stop-Service go-fs
          if (-not (Select-String -Quiet -Path $log -Pattern "shutdown complete")) { throw "no clean shutdown" }
          $uninstall = Start-Process msiexec -Wait -PassThru -ArgumentList "/x go-fs.msi /qn /l*v uninstall.log"
          if ($uninstall.ExitCode -ne 0) { Get-Content uninstall.log -Tail 80; exit $uninstall.ExitCode }
          if (Get-Service go-fs -ErrorAction SilentlyContinue) { throw "the service is still there" }
          if (-not (Test-Path "$env:ProgramData\go-fs\go-fs.toml")) { throw "the uninstall removed the configuration" }

# The rpm packages of go-fs and go-fs-light, built by make rpm with nfpm,
# which expands from its environment VERSION, the released version, ARCH, the
# Go architecture, NAME, the product, CONFLICTS, the other product, and
# SERVES, what the product serves. The files are relative to the repository
# root, where make runs nfpm, and make puts them in build/pkg/linux for each
# product and architecture in turn: the binary built with
# -X main.packaging=rpm and the starter configuration, serving
# /var/lib/go-fs/files.
#
# Everything but the binary and the unit is kept in /var/lib/go-fs, the
# configuration included: postinstall copies the starter there as go-fs.toml
# when there is none, and preinstall moves one an older package left in
# /etc/go-fs. The file is not the package's, so an upgrade never touches it
# and a removal keeps it.
#
# Both products install the same files, the service and the folders, so they
# conflict: one is swapped for the other by removing it first.
name: ${NAME}
arch: ${ARCH}
platform: linux
version: ${VERSION}
release: 1
section: net
maintainer: Sven Beisiegel
vendor: Sven Beisiegel
homepage: https://github.com/mailsvb/go-fs
license: Apache-2.0
# the first line is the summary as well
description: |
  ${SERVES}
  in a single binary, configured from one TOML file, with hot reload and a
  web interface for editing it. Runs as the go-fs systemd service.

conflicts:
  - ${CONFLICTS}

contents:
  - src: build/pkg/linux/go-fs
    dst: /usr/bin/go-fs
    file_info:
      mode: 0755

  - src: packaging/linux/go-fs.service
    dst: /usr/lib/systemd/system/go-fs.service
    file_info:
      mode: 0644

  # the starter configuration, which postinstall copies to
  # /var/lib/go-fs/go-fs.toml when there is none; it holds no secret, go-fs
  # generates those at the first start
  - src: build/pkg/linux/go-fs.toml
    dst: /usr/share/go-fs/go-fs.toml
    file_info:
      mode: 0644

  # The folder of the configuration and of what the template serves. go-fs
  # writes its configuration file itself, the generated secrets and every
  # change made in the admin interface, by writing a file beside it and
  # renaming that over it, so the folder is the service's.
  - dst: /var/lib/go-fs
    type: dir
    file_info:
      mode: 0750
      owner: go-fs
      group: go-fs
  - dst: /var/lib/go-fs/files
    type: dir
    file_info:
      mode: 0750
      owner: go-fs
      group: go-fs
  # the folder of the container registry, beside the served one
  - dst: /var/lib/go-fs/registry
    type: dir
    file_info:
      mode: 0750
      owner: go-fs
      group: go-fs
  # the folder of the disk images of the Disks page and the nbd server,
  # beside the served one
  - dst: /var/lib/go-fs/disks
    type: dir
    file_info:
      mode: 0750
      owner: go-fs
      group: go-fs
  # the folder uploads are staged in until they are finished, beside the
  # served one so that finishing one is a rename
  - dst: /var/lib/go-fs/temp
    type: dir
    file_info:
      mode: 0700
      owner: go-fs
      group: go-fs
  # the folder what is deleted over http is kept in, beside the served one so
  # that a delete is a rename
  - dst: /var/lib/go-fs/trash
    type: dir
    file_info:
      mode: 0700
      owner: go-fs
      group: go-fs

  - src: LICENSE
    dst: /usr/share/licenses/${NAME}/LICENSE
    expand: true
    file_info:
      mode: 0644

scripts:
  preinstall: packaging/linux/preinstall.sh
  postinstall: packaging/linux/postinstall.sh
  preremove: packaging/linux/preremove.sh
  postremove: packaging/linux/postremove.sh

# The rpm is signed when SIGNING_KEY_FILE names an armored private key, as in
# the release workflow; NFPM_RPM_PASSPHRASE unlocks it. Unset, it is unsigned.
rpm:
  group: System Environment/Daemons
  signature:
    key_file: ${SIGNING_KEY_FILE}

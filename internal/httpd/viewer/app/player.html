<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="referrer" content="no-referrer">
<title>Player</title>
<link rel="stylesheet" href="videojs/video-js.min.css">
<link rel="stylesheet" href="player.css">
<script type="module" src="player.js"></script>
</head>
<body>
<svg class="icons" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <symbol id="i-music" viewBox="0 0 24 24"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></symbol>
  <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
  <symbol id="i-speaker" viewBox="0 0 24 24"><path d="M6.5 3h11v18h-11z"/><circle cx="12" cy="14" r="3.5"/><path d="M12 7.5v.5"/></symbol>
  <symbol id="i-previous" viewBox="0 0 24 24"><path d="M6 5v14"/><path d="M19 5 9 12l10 7z"/></symbol>
  <symbol id="i-next" viewBox="0 0 24 24"><path d="M18 5v14"/><path d="M5 5l10 7-10 7z"/></symbol>
  <symbol id="i-play" viewBox="0 0 24 24"><path d="M7 4.5v15l12-7.5z"/></symbol>
  <symbol id="i-pause" viewBox="0 0 24 24"><path d="M8 5v14M16 5v14"/></symbol>
  <symbol id="i-stop" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="1.5"/></symbol>
  <symbol id="i-volume" viewBox="0 0 24 24"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/></symbol>
</svg>
<div class="track">
  <svg class="ic note"><use href="#i-music" id="note"/></svg>
  <div class="about">
    <span class="name" id="name">Nothing playing</span>
    <span class="where" id="where" role="status"></span>
  </div>
</div>
<div class="controls" id="controls">
  <audio id="audio" class="video-js" preload="auto"></audio>
</div>
<div class="remote" id="remote" hidden>
  <button class="plain" id="r-previous" type="button" title="Previous"><svg class="ic"><use href="#i-previous"/></svg></button>
  <button class="plain" id="r-toggle" type="button" title="Pause"><svg class="ic"><use href="#i-pause"/></svg></button>
  <button class="plain" id="r-next" type="button" title="Next"><svg class="ic"><use href="#i-next"/></svg></button>
  <span class="clock" id="r-clock"></span>
  <div class="progress" aria-hidden="true"><div class="done" id="r-done"></div></div>
  <svg class="ic vol" aria-hidden="true"><use href="#i-volume"/></svg>
  <input type="range" id="r-volume" min="0" max="100" step="1" value="0" aria-label="Volume of the speakers">
  <button class="plain" id="r-stop" type="button" title="Stop playing on Sonos"><svg class="ic"><use href="#i-stop"/></svg></button>
</div>
<button class="plain icon" id="sonos" type="button" title="Play on Sonos…" hidden><svg class="ic"><use href="#i-speaker"/></svg></button>
<button class="plain icon" id="close" type="button" title="Close the player"><svg class="ic"><use href="#i-close"/></svg></button>
</body>
</html>

# go-fs configuration
#
# Every key is optional, an absent key keeps the default shown here. Paths have
# to exist before the server starts.

# What every server shares. basefolder is the folder they all fall back to when
# their own section does not name one, so a setup where they serve the same tree
# says it once here. It has to be an absolute path and it has to exist.
[general]
basefolder = "/srv/files"

# Watch this file and apply what changes in it without a restart. Accounts,
# permissions and limits are swapped without disturbing anything in flight; a
# port, a folder or a certificate needs the listener rebound, so that one server
# is restarted and only its connections drop. A file that does not parse or does
# not validate is reported and ignored, so a half-written save cannot take a
# server down. On unix, kill -HUP also reloads, whatever this says.
reloadConfig = true
# seconds between two checks of the file
reloadInterval = 5

# The web interface that edits this file. It is off unless it is switched on,
# so an upgrade never opens it by itself. Applying a change there rewrites this
# file through the toml writer: every key is written out and the comments you
# are reading are lost, with the previous file kept beside it as go-fs.toml.bak.
adminInterfaceEnabled = false
# The interface it binds to. It is the loopback address by default, because the
# page shows and edits every password in this file; reach it from elsewhere
# through an ssh tunnel, or set this to "" to bind every interface.
adminInterfaceAddress = "127.0.0.1"
adminInterfacePort = 10443
# Serve the interface over TLS. Turn it off only to put a proxy that terminates
# TLS in front of it, which then listens on this port instead: with nothing in
# front, the admin password and every password on the page cross the network in
# the clear.
adminInterfaceUseHttps = true
# The single account of the interface. Both have to be set for it to start.
adminUsername = "admin"
adminPassword = ""
# The certificate the interface serves, for as long as it serves TLS. These hold
# the certificate and its key themselves, base64 of the PEM, the way hostkey
# below does; when both are empty a self-signed certificate is generated at
# startup, which changes on every restart and proves no identity. Produce a
# value with
#   base64 < server.crt | tr -d "\n"
# or press Upload in the web interface, which puts the file here for you.
adminCert = ""
adminKey = ""

[log]
# debug shows the protocol trace, info reports listeners, logins and transfers.
level = "info"
# text or json
format = "text"

[ftp]
# Serve the plain control port. The TLS listener has its own switch in [ftps];
# everything else in this section applies to both of them.
enabled = true
port = 21
# interface the control ports and the passive data ports bind to, empty binds
# to all
address = ""
# served folder. Uncomment to serve something other than
# general.basefolder; it has to exist either way.
# basefolder = "/srv/ftp"

# maximum simultaneous control connections
maxConnections = 10

# The data channel, which is the part a firewall has to be told about. Which
# mode is used is the client's choice, and both are always served.
#
# Passive (PASV, EPSV): the client connects to the server, on a port out of this
# range. Open the whole range in the firewall; it should hold at least
# maxConnections ports, since a transfer takes one for as long as it runs.
passiveMinPort = 1024
# last port of that range, inclusive
passiveMaxPort = 1034
# Active (PORT, EPRT): the server connects to the client, from this port. 0
# lets the system pick one, which means a firewall cannot name it; 20 is the
# port RFC 959 uses and what a firewall written for active FTP expects, but on
# unix binding it needs the privilege for ports below 1024.
activeSourcePort = 0
# The address a PASV reply tells the client to connect back to. Empty names the
# address the control connection arrived on, which is right whenever nothing
# translates in between; set it to the address clients reach this host at when
# the server is behind NAT or in a container. It has to be IPv4, which is all a
# PASV reply can carry, and it does not affect EPSV, which names no address.
passiveAddress = ""
# seconds an idle control connection is kept open, 0 disables
idleTimeout = 600
# seconds to wait for the data connection of a transfer to be established
dataTimeout = 5
# Seconds a running transfer may move nothing before it is dropped, 0 disables.
# It bounds a stall rather than the length of a transfer, so a download of any
# size finishes, while a client that opens the data connection and stops reading
# gives its connection slot back instead of holding it until it disconnects.
transferIdleTimeout = 300
# maximum length of a single command line in bytes
maxCommandLength = 4096
# seconds to wait before answering a wrong password
loginFailureDelay = 1

# Allow PORT and EPRT to name a host other than the connected client. Off by
# default, because it lets the server reach third parties on a client's behalf
# (RFC 2577). Only needed for server to server transfers.
allowFtpBounce = false
# Allow passive data connections from another address than the control
# connection. Off by default.
allowForeignDataConnection = false

# The TLS interface of the same FTP server: it serves the accounts, folders and
# limits of [ftp] above.
[ftps]
# Listen on ftps.port and offer AUTH TLS on the plain port. Independent of
# ftp.enabled, so turning that one off serves implicit FTPS only.
enabled = false
port = 990
# The certificate and its key themselves, base64 of the PEM, not paths to them,
# so the whole configuration stays in this one file:
#   base64 < server.crt | tr -d "\n"
# When both are empty a self-signed certificate is generated at startup; it
# changes on every restart and proves no identity, so set your own for anything
# but a quick test.
cert = ""
key = ""

# One table per account, repeated for as many as are needed. There is no default
# account: a name that is not listed here cannot log in, so as this file stands
# the server accepts nobody. The example below is commented out on purpose —
# uncomment it and put a name and a password of your own in, rather than
# starting with the ones printed in the documentation.
# [[ftp.users]]
# username = "john"
# password = "doe"
# own folder for this user, defaults to ftp.basefolder
# basefolder = "/srv/ftp/john"
# accept this user without a password, off by default
# allowLoginWithoutPassword = false
# What the account may do. All false when not set, so an account with none of
# these can log in and look around and nothing more; grant what it needs.
# allowUserFileCreate = true
# allowUserFileRetrieve = true
# allowUserFileOverwrite = true
# allowUserFileDelete = true
# allowUserFolderDelete = true
# allowUserFolderCreate = true

# Anonymous access is an ordinary account: the name clients use, with no
# password. Below it may read, and nothing else. Uncommenting this hands the
# folder to anyone who can reach the port.
# [[ftp.users]]
# username = "anonymous"
# password = ""
# allowLoginWithoutPassword = true
# allowUserFileRetrieve = true

# The SFTP server, which is the SFTP subsystem of an SSH server. It has the
# shape of [ftp]: a base folder and a list of accounts with the same permission
# flags. Off unless switched on, so that upgrading never opens an SSH port by
# itself.
[sftp]
enabled = false
port = 22
# interface to bind to, empty binds to all
address = ""
# served folder. Uncomment to serve something other than
# general.basefolder; it has to exist either way.
# basefolder = "/srv/sftp"

# The SSH host key, base64 of its PEM encoding, so the whole configuration
# stays in this one file. Empty generates a key at every start, which makes
# every client report a changed host key; produce a stable one with
#   ssh-keygen -q -t ed25519 -N "" -f hostkey && base64 < hostkey | tr -d "\n"
hostkey = ""

# maximum simultaneous connections
maxConnections = 10
# seconds without any traffic after which a connection is closed, 0 disables
idleTimeout = 600
# seconds to wait before answering a wrong password
loginFailureDelay = 1

# One table per account, as under [ftp], with the same permission flags and the
# same denied by default rule. Each account needs a password or at least one
# authorized key: SSH has no anonymous login, so allowLoginWithoutPassword does
# nothing here.
# [[sftp.users]]
# username = "john"
# password = "doe"
# own folder for this user, defaults to sftp.basefolder
# basefolder = "/srv/sftp/john"
# allowUserFileCreate = true
# allowUserFileRetrieve = true
# allowUserFileOverwrite = true
# allowUserFileDelete = true
# allowUserFolderDelete = true
# allowUserFolderCreate = true

# An account that logs in with a key instead of a password. Uncomment it and
# put your own key in: the entries are authorized_keys lines, that is the whole
# content of an id_*.pub file, and every one of them has to parse or the server
# will not start.
# [[sftp.users]]
# username = "max"
# authorizedKeys = [
#   "ssh-ed25519 AAAA...the rest of your id_ed25519.pub... max@laptop",
# ]
# allowUserFileRetrieve = true

# The HTTP file server: browse and download with GET, upload with PUT, remove
# with DELETE. Access has two layers. A request is public unless its method is
# in methodsRequireAuth or its path matches one of pathsRequireAuth; when it is
# not public it has to be answered by one of the accounts below, whose own
# paths and rights then decide what it may do.
[http]
# Serve the plain port. The TLS listener has its own switch in [https];
# everything else in this section applies to both of them.
enabled = false
port = 9080
# interface both listeners bind to, empty binds to all
address = ""
# served folder. Uncomment to serve something other than
# general.basefolder; it has to exist either way.
# basefolder = "/srv/http"
# what clients are challenged with. It is hashed into the digest response, so
# changing it makes browsers ask for the password again.
realm = "go-fs"

# maximum simultaneous connections
maxConnections = 100
# seconds, 0 disables one. writeTimeout is off because it would cap how long a
# download may take.
readTimeout = 120
writeTimeout = 0
idleTimeout = 120
# largest accepted upload in bytes, 0 means no limit
maxUploadSize = 0
# how long a session cookie stays valid, in seconds
sessionTimeout = 86400
# seconds to wait before answering a request that could not be authenticated
loginFailureDelay = 1

# Methods that always need an account.
methodsRequireAuth = ["PUT", "DELETE", "POST"]
# Regular expressions; a request whose path matches one of these needs an
# account whatever its method. Everything else is public.
pathsRequireAuth = []

# The TLS interface of the same HTTP server: it serves the folder, accounts and
# limits of [http] above.
[https]
# Independent of http.enabled, so turning that one off serves HTTPS only.
enabled = false
port = 9443
# The certificate and its key themselves, base64 of the PEM, not paths to them,
# so the whole configuration stays in this one file:
#   base64 < server.crt | tr -d "\n"
# When both are empty a self-signed certificate is generated at startup; it
# changes on every restart and proves no identity, so set your own for anything
# but a quick test.
cert = ""
key = ""

# Folders that are kept from growing without bound: once an hour everything but
# the newest "keep" files in them is deleted. Remove these blocks to switch the
# sweep off. Paths are relative to http.basefolder.
# [[http.cleanup]]
# path = "/iso"
# keep = 10

# One table per account. paths are regular expressions matched against the
# request path after it has been normalized, so ".." cannot be used to slip
# past one; an account with no pattern can reach nothing. Both permissions are
# false when not set, as everywhere else. As with [[ftp.users]], the examples
# are commented out: put in a name and a password of your own.
# [[http.users]]
# username = "john"
# password = "doe"
# paths = ["^/.*"]
# allowUserFileUpload = true
# allowUserFileDelete = true
# Hand this account a session cookie once it has authenticated, so that a
# browser does not repeat the credentials on every request. The session carries
# exactly these rights, and cookiePath only tells the browser which URLs to
# send it back for.
# cookie = false
# cookiePath = "/"

# An account that may only read, and only below one folder.
# [[http.users]]
# username = "max"
# password = "mustermann"
# paths = ["^/public/.*"]
# cookie = true
# cookiePath = "/public/"

# The TFTP server. TFTP has no accounts and no passwords: the protocol has no
# way to carry them, so anyone who can reach this port can read what allowRead
# allows and write what allowWrite allows. Turn it off, or keep it on a network
# where that is what you want.
[tftp]
enabled = true
port = 69
# interface to bind to, empty binds to all
address = ""
# udp4, udp6 or empty. Empty derives it from address and otherwise uses udp6,
# which also accepts IPv4 clients on a dual stack host. Set udp4 explicitly on
# hosts configured with bindv6only.
type = ""
# served folder. Uncomment to serve something other than
# general.basefolder; it has to exist either way.
# basefolder = "/srv/tftp"

allowRead = true
allowWrite = false
# allow a write request to replace an existing file
allowOverwrite = false
# allow a write request to create the folders leading up to the file
allowCreateDirectory = true

# maximum simultaneous transfers, and how many of them one client may hold
maxConnections = 10
maxConnectionsPerHost = 5
# seconds before a packet is retransmitted
timeout = 5
# highest retransmit interval a client may negotiate with the timeout option
maxTimeout = 60
# retransmissions before a transfer is given up
retries = 3
# seconds a single transfer may take in total, 0 disables
transferTimeout = 300
# largest negotiable block size, larger requests are capped. The default keeps a
# block inside a typical ethernet MTU so datagrams are not IP fragmented.
maxBlockSize = 1468
# largest negotiable window size, larger requests are capped
maxWindowSize = 16
# largest accepted upload in bytes, 0 means no limit
maxFileSize = 0

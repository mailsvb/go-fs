{{define "credentials"}}
<svg id="credentials-icons" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <symbol id="i-cred-key" viewBox="0 0 24 24"><circle cx="8" cy="15" r="4.5"/><path d="m11.2 11.8 8.3-8.3m-3 3 2.5 2.5m-5-0.5 2 2"/></symbol>
  <symbol id="i-cred-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 20.5a8 8 0 0 1 16 0"/></symbol>
</svg>
<dialog id="credentials" class="credentials" aria-labelledby="credentials-title" data-action="{{.Credentials}}">
  <form method="dialog">
    <h2 id="credentials-title"><svg class="ic"><use href="#i-cred-key"/></svg>Change password</h2>
    <p class="where"><svg class="ic"><use href="#i-cred-user"/></svg>{{.User}}</p>
    <p class="problem" role="alert" hidden></p>
    <p class="done" role="status" hidden>The password was changed.</p>
    <input class="user" name="username" type="text" autocomplete="username" value="{{.User}}" tabindex="-1" aria-hidden="true">
    <div class="fields">
      <label for="credentials-current">Current password</label>
      <input id="credentials-current" name="current" type="password" autocomplete="current-password" required>
      <label for="credentials-new">New password</label>
      <input id="credentials-new" name="password" type="password" autocomplete="new-password" minlength="8" required>
      <label for="credentials-repeat">Repeat new password</label>
      <input id="credentials-repeat" name="repeat" type="password" autocomplete="new-password" minlength="8" required>
    </div>
    <div class="row">
      <button class="go" type="submit" value="apply">Apply</button>
      <button class="plain cancel" type="button">Cancel</button>
    </div>
  </form>
</dialog>
{{end}}
